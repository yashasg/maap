name: Maap image

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maap-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  image:
    needs: checks
    if: github.actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      COMPOSE_FILE: ${{ github.workspace }}/deploy/maap/docker-compose.yml
      COMPOSE_PROJECT_NAME: maap-ci
      UMAMI_IMAGE_TAG: ${{ github.sha }}
      # Required by Compose during interpolation; no connector is started in CI.
      TUNNEL_TOKEN: unused-in-disposable-ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Install test dependencies
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm install --frozen-lockfile
          pnpm build:packages
          pnpm openapi:generate
          pnpm exec playwright install --with-deps chromium
      - name: Test TelemetryDeck adapter
        run: node --test tests/maap/*.test.mjs

      - name: Build release Dockerfile for amd64
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/umami-td"
          echo "UMAMI_IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --tag "$image:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Exercise the default standalone Rust runtime with PostgreSQL
        run: |
          APP_SECRET="$(openssl rand -hex 32)"
          TWO_FACTOR_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export APP_SECRET TWO_FACTOR_ENCRYPTION_KEY POSTGRES_PASSWORD
          unset MAAP_SERVER MAAP_NODE_FALLBACK
          trap 'docker compose down --volumes' EXIT
          docker compose config --quiet
          docker compose pull db
          docker compose up --wait --wait-timeout 240 --pull never db umami
          docker inspect --format '{{json .State.Health.Log}}' "$(docker compose ps -q umami)" |
            jq -e 'last.Output | fromjson | .ok and .server == "rust" and .node_processes == 0
              and .rss_mib > 0 and .peak_rss_mib >= .rss_mib and .swap_mib >= 0
              and .container_working_set_mib > 0 and .container_limit_mib == 450 and .host_available_mib > 0'
          docker compose exec -T umami node --input-type=module < tests/maap-image/smoke.mjs
          BACKUP_DIR="$(mktemp -d "$RUNNER_TEMP/maap-backup.XXXXXXXX")"
          export BACKUP_DIR
          bash deploy/maap/backup.sh
          bash deploy/maap/restore-drill.sh "$BACKUP_DIR"/maap-*.dump
      - name: Gate release on Node and zero-Node Rust Playwright suites
        run: |
          status=0
          export UMAMI_TEST_IMAGE="$UMAMI_IMAGE:$GITHUB_SHA"
          export MAAP_SERVER MAAP_NODE_FALLBACK=0
          for MAAP_SERVER in node rust; do
            for suite in test:api test:e2e:docker; do
              export COMPOSE_PROJECT_NAME="maap-${MAAP_SERVER}-${suite//:/-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              echo "::group::$MAAP_SERVER $suite"
              if ! pnpm "$suite" --no-build; then
                echo "::error::$MAAP_SERVER $suite failed"
                status=1
              fi
              echo "::endgroup::"
            done
          done
          exit "$status"
      - name: Publish tested image to GHCR
        if: success() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor == github.repository_owner
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$UMAMI_IMAGE:$GITHUB_SHA"
          docker tag "$UMAMI_IMAGE:$GITHUB_SHA" "$UMAMI_IMAGE:latest"
          docker push "$UMAMI_IMAGE:latest"
      - name: Deploy published image to GCP e2-micro over IAP
        if: success() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor == github.repository_owner
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_INSTANCE: ${{ secrets.GCP_INSTANCE }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          audience="https://iam.googleapis.com/${GCP_WORKLOAD_IDENTITY_PROVIDER}"
          curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -r .value > "$RUNNER_TEMP/oidc.jwt"
          gcloud iam workload-identity-pools create-cred-config "$GCP_WORKLOAD_IDENTITY_PROVIDER" \
            --service-account="$GCP_SERVICE_ACCOUNT" \
            --credential-source-file="$RUNNER_TEMP/oidc.jwt" \
            --output-file="$RUNNER_TEMP/gcp-creds.json"
          gcloud auth login --cred-file="$RUNNER_TEMP/gcp-creds.json" --quiet
          {
            printf '%s\n%s\n' "$GHCR_TOKEN" "$TUNNEL_TOKEN"
            tar -czf - -C deploy/maap docker-compose.yml .env.example backup.sh restore-drill.sh deploy.sh
          } | gcloud compute ssh "$GCP_INSTANCE" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo bash -euo pipefail -c '
              IFS= read -r GHCR_TOKEN
              IFS= read -r TUNNEL_TOKEN
              export GHCR_TOKEN TUNNEL_TOKEN
              stage=\$(mktemp -d)
              trap \"rm -rf -- \\\"\\\$stage\\\"\" EXIT
              tar -xzf - -C \"\$stage\"
              install -d -m 0755 -o root -g root /opt/maap
              install -m 0644 -o root -g root \"\$stage/docker-compose.yml\" \"\$stage/.env.example\" /opt/maap/
              install -m 0755 -o root -g root \"\$stage/backup.sh\" \"\$stage/restore-drill.sh\" \"\$stage/deploy.sh\" /opt/maap/
              /opt/maap/deploy.sh \"$GITHUB_SHA\"
            '"
